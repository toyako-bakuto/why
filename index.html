<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Web - Question Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>🤔 Why Web</h1>
            <p>Think, Write, Answer</p>
            <button id="openModalBtn" class="btn-add">+ Tanya Baru</button>
        </header>

        <main>
            <div id="questionsGrid" class="questions-grid">
                <!-- Pertanyaan akan ditampilkan di sini dengan grid 4 baris -->
            </div>
        </main>
    </div>

    <!-- Modal Popup untuk Form -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Buat Pertanyaan Baru</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalQuestion">Pertanyaan:</label>
                    <textarea id="modalQuestion" rows="3" placeholder="Tulis pertanyaanmu di sini..."></textarea>
                </div>
                <div class="form-group">
                    <label for="modalAnswer">Jawaban (opsional, bisa diisi nanti):</label>
                    <textarea id="modalAnswer" rows="4" placeholder="Tulis jawabanmu di sini..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveQuestionBtn" class="btn-save">💾 Simpan</button>
                <button class="btn-cancel close">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal untuk Menjawab Pertanyaan -->
    <div id="answerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💭 Jawab Pertanyaan</h2>
                <span class="close-answer">&times;</span>
            </div>
            <div class="modal-body">
                <div class="question-display" id="answerQuestionDisplay"></div>
                <div class="form-group">
                    <label for="answerInput">Jawabanmu:</label>
                    <textarea id="answerInput" rows="5" placeholder="Tulis jawabanmu di sini..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="submitAnswerBtn" class="btn-save">✅ Jawab</button>
                <button class="btn-cancel close-answer">Batal</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
